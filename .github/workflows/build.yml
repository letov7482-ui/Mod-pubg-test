name: Build PUBG Mobile Mod APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to original PUBG Mobile APK (64-bit)'
        required: true
        type: string
      keystore_pass:
        description: 'Keystore password (optional, will generate if empty)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK
        run: |
          # Accept licenses first
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Install NDK (runner already has SDK, no setup-android needed)
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "NDK installed:"
          ls $ANDROID_HOME/ndk/

      - name: Install build tools
        run: |
          # zipalign and apksigner are already on runner, verify
          which zipalign || sdkmanager "build-tools;34.0.0"
          export PATH=$PATH:$ANDROID_HOME/build-tools/34.0.0
          which zipalign && which apksigner
          echo "PATH updated"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner || true
          # If not in apt, use from build-tools
          echo "SDK build-tools:"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "none"

      - name: Download original APK
        run: |
          wget -q "${{ inputs.apk_url }}" -O original.apk
          ls -la original.apk
          file original.apk

      - name: Build native library
        run: |
          cd jni
          $ANDROID_NDK_HOME/ndk-build \
              NDK_PROJECT_PATH=. \
              APP_BUILD_SCRIPT=Android.mk \
              NDK_APPLICATION_MK=Application.mk
          ls -la libs/arm64-v8a/

      - name: Decompile APK
        run: |
          APKTOOL_VER=2.9.3
          wget -q "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_${APKTOOL_VER}.jar" -O apktool.jar
          ls -la apktool.jar
          java -jar apktool.jar d original.apk -o decompiled --no-res -f
          ls decompiled/

      - name: Inject Mod into APK
        run: |
          cd decompiled
          mkdir -p lib/arm64-v8a
          cp ../libs/arm64-v8a/libpmod.so lib/arm64-v8a/
          mkdir -p smali/com/pubg/mod

          cat > smali/com/pubg/mod/NativeBridge.smali << 'SMALI_EOF'
          .class public Lcom/pubg/mod/NativeBridge;
          .super Ljava/lang/Object;

          .method public constructor <init>()V
              .locals 0
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method

          .method public static native init()V
          .end method

          .method public static native setESPEnabled(Z)V
          .end method

          .method public static native setAimbotEnabled(Z)V
          .end method

          .method public static native setAimbotFOV(F)V
          .end method

          .method public static native setAimbotSmoothing(F)V
          .end method

          .method public static native setAimbotBone(I)V
          .end method

          .method public static native setAimbotSilent(Z)V
          .end method

          .method public static native setAimbotVisibleOnly(Z)V
          .end method

          .method public static native setESPBox(Z)V
          .end method

          .method public static native setESPSkeleton(Z)V
          .end method

          .method public static native setESPHealthBar(Z)V
          .end method

          .method public static native setESPName(Z)V
          .end method

          .method public static native setESPDistance(Z)V
          .end method

          .method public static native setESPLine(Z)V
          .end method

          .method public static native setESPMaxDistance(F)V
          .end method
          SMALI_EOF

          cat > smali/com/pubg/mod/Injector.smali << 'SMALI_EOF'
          .class public Lcom/pubg/mod/Injector;
          .super Ljava/lang/Object;

          .method public constructor <init>()V
              .locals 0
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method

          .method public static load()V
              .locals 1

              :try_start_0
              const-string v0, "pmod"
              invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V

              const-string v0, "PMod"
              const-string v1, "Native library loaded successfully"
              invoke-static {v0, v1}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I

              invoke-static {}, Lcom/pubg/mod/NativeBridge;->init()V
              :try_end_0
              .catch Ljava/lang/Throwable; {:try_start_0 .. :try_end_0} :catch_0

              return-void

              :catch_0
              move-exception v0
              const-string v0, "PMod"
              const-string v1, "Failed to load native library"
              invoke-static {v0, v1}, Landroid/util/Log;->e(Ljava/lang/String;Ljava/lang/String;)I

              return-void
          .end method
          SMALI_EOF

      - name: Patch entry point
        run: |
          cd decompiled
          python3 << 'PYTHON_EOF'
          import os, re

          main_class = None
          for root, dirs, files in os.walk("smali"):
              for f in files:
                  if f.endswith(".smali"):
                      path = os.path.join(root, f)
                      with open(path, 'r', errors='ignore') as fh:
                          content = fh.read()
                          if ".super Landroid/app/Application;" in content:
                              main_class = path
                              break
              if main_class:
                  break

          if not main_class:
              for root, dirs, files in os.walk("smali"):
                  for f in files:
                      if "MainActivity" in f and f.endswith(".smali"):
                          main_class = os.path.join(root, f)
                          break
                  if main_class:
                      break

          if not main_class:
              print("[-] No main class found, listing candidates:")
              for root, dirs, files in os.walk("smali"):
                  for f in files[:5]:
                      print(os.path.join(root, f))
              exit(0)

          print(f"[*] Patching: {main_class}")
          with open(main_class, 'r', errors='ignore') as fh:
              content = fh.read()

          injection = "    invoke-static {}, Lcom/pubg/mod/Injector;->load()V\n"

          # attachBaseContext
          m = re.search(r'(\.method.*attachBaseContext\(Landroid/content/Context;\)V.*?invoke-super \{p0, p1\}, Landroid/app/Application;->attachBaseContext\(Landroid/content/Context;\)V)', content, re.DOTALL)
          if m:
              content = content.replace(m.group(1), m.group(1) + injection)
              print("[+] Injected into attachBaseContext")
          else:
              # onCreate of Application
              m = re.search(r'(\.method.*onCreate\(\)V.*?invoke-super \{p0\}, Landroid/app/Application;->onCreate\(\)V)', content, re.DOTALL)
              if m:
                  content = content.replace(m.group(1), m.group(1) + injection)
                  print("[+] Injected into Application onCreate")
              else:
                  # Activity onCreate
                  m = re.search(r'(\.method.*onCreate\(Landroid/os/Bundle;\)V.*?invoke-super \{p0, p1\}, Landroid/app/[^;]+;->onCreate\(Landroid/os/Bundle;\)V)', content, re.DOTALL)
                  if m:
                      content = content.replace(m.group(1), m.group(1) + injection)
                      print("[+] Injected into Activity onCreate")
                  else:
                      print("[!] Could not auto-inject. Manual check needed.")
                      print(content[:2000])

          with open(main_class, 'w') as fh:
              fh.write(content)
          PYTHON_EOF

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled -o modded_unsigned.apk --use-aapt2
          ls -la modded_unsigned.apk

      - name: Sign APK
        run: |
          if [ -z "${{ inputs.keystore_pass }}" ]; then
            export STORE_PASS="pmod123456"
          else
            export STORE_PASS="${{ inputs.keystore_pass }}"
          fi
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV

          keytool -genkey -v \
            -keystore signing.keystore \
            -alias pmod \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass $STORE_PASS \
            -keypass $STORE_PASS \
            -dname "CN=PMod, OU=PMod, O=PMod, L=PMod, ST=PMod, C=US"

          # zipalign from build-tools
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          $BT/zipalign -v -p 4 modded_unsigned.apk modded_aligned.apk

          $BT/apksigner sign \
            --ks signing.keystore \
            --ks-key-alias pmod \
            --ks-pass pass:$STORE_PASS \
            --key-pass pass:$STORE_PASS \
            --out PUBG_Mobile_PMod_4.6.0_signed.apk \
            modded_aligned.apk

          $BT/apksigner verify --verbose PUBG_Mobile_PMod_4.6.0_signed.apk
          ls -la PUBG_Mobile_PMod_4.6.0_signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-Mobile-PMod-signed
          path: PUBG_Mobile_PMod_4.6.0_signed.apk
          retention-days: 30
