      - name: Download original APK
        run: |
          UA="Mozilla/5.0 (Linux; Android 13; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"

          download_apk() {
            local url="$1"
            echo "Trying: $url"
            curl -L -sS --fail \
              -H "User-Agent: $UA" \
              -H "Referer: https://apkpure.com/" \
              -H "Accept: application/vnd.android.package-archive,*/*" \
              --connect-timeout 30 \
              --max-time 900 \
              -o original.bin "$url" || return 1

            # Check magic bytes: APK = PK (zip), XAPK/APKM = PK too, HTML = fail
            MAGIC=$(head -c 2 original.bin)
            echo "Magic bytes: $MAGIC"
            [ "$MAGIC" = "PK" ] && return 0
            return 1
          }

          # Try sources in order
          SOURCES=(
            "${{ inputs.apk_url }}"
            "https://d.apkpure.com/b/XAPK/com.tencent.ig?versionCode=21518"
            "https://d.apkpure.net/b/APK/com.tencent.ig?versionCode=21518"
            "https://download.apkpure.one/com.tencent.ig?versionCode=21518"
          )

          SUCCESS=0
          for url in "${SOURCES[@]}"; do
            [ -z "$url" ] && continue
            if download_apk "$url"; then
              SUCCESS=1
              echo "Downloaded from: $url"
              break
            fi
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "::error::Download failed. File content:"
            head -c 500 original.bin
            exit 1
          fi

          # Check if it's XAPK/APKM (zip containing APKs)
          FILE_TYPE=$(unzip -l original.bin 2>/dev/null | grep -cE "\.(apk)$" || true)

          if [ "$FILE_TYPE" -gt 0 ]; then
            echo "[*] XAPK/APKM detected, extracting..."

            # List contents
            unzip -l original.bin

            # Extract the arm64 APK
            mkdir -p xapk_extract
            unzip -o original.bin -d xapk_extract
            ls -la xapk_extract/

            # Find main APK (contains lib/ and classes.dex or is largest)
            MAIN_APK=""
            for f in xapk_extract/*.apk; do
              if unzip -l "$f" 2>/dev/null | grep -q "lib/arm64-v8a/libUE4.so"; then
                MAIN_APK="$f"
                break
              fi
            done

            # Fallback: take largest APK
            if [ -z "$MAIN_APK" ]; then
              MAIN_APK=$(ls -S xapk_extract/*.apk | head -1)
            fi

            cp "$MAIN_APK" original.apk
            rm -rf xapk_extract
          else
            mv original.bin original.apk
          fi

          ls -la original.apk
          file original.apk
