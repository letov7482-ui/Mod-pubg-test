name: Build PUBG Mobile Mod APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to original PUBG Mobile APK (64-bit)'
        required: true
        type: string
      keystore_pass:
        description: 'Keystore password (optional, will generate if empty)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner python3-pip
          pip install --upgrade pip
          pip install androguard  # For APK analysis

      - name: Download original APK
        run: |
          wget -q "${{ inputs.apk_url }}" -O original.apk
          ls -la original.apk
          file original.apk

      - name: Build native library
        run: |
          cd jni
          export NDK_PROJECT_PATH=$(pwd)/..
          export NDK_APPLICATION_MK=$(pwd)/Application.mk
          export APP_BUILD_SCRIPT=$(pwd)/Android.mk
          ${{ env.ANDROID_NDK_HOME }}/ndk-build NDK_PROJECT_PATH=. \
              APP_BUILD_SCRIPT=Android.mk \
              NDK_APPLICATION_MK=Application.mk
          ls -la ../libs/arm64-v8a/

      - name: Decompile APK with apktool
        run: |
          # Download and install apktool
          APKTOOL_VER=2.9.3
          wget -q "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_${APKTOOL_VER}.jar" -O apktool.jar
          sudo cp apktool.jar /usr/local/bin/
          sudo chmod +x /usr/local/bin/apktool.jar

          # Create wrapper script
          echo '#!/bin/sh
          java -jar /usr/local/bin/apktool.jar "$@"' | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool

          # Decompile
          java -jar apktool.jar d original.apk -o decompiled --no-res
          ls -la decompiled/

      - name: Inject Mod into APK
        run: |
          cd decompiled

          # Copy native library
          mkdir -p lib/arm64-v8a
          cp ../libs/arm64-v8a/libpmod.so lib/arm64-v8a/

          # Create package structure for our classes
          mkdir -p smali/com/pubg/mod

          # Create NativeBridge smali class
          cat > smali/com/pubg/mod/NativeBridge.smali << 'SMALI_EOF'
          .class public Lcom/pubg/mod/NativeBridge;
          .super Ljava/lang/Object;

          .method public constructor <init>()V
              .locals 0
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method

          .method public static native init()V
          .end method

          .method public static native setESPEnabled(Z)V
          .end method

          .method public static native setAimbotEnabled(Z)V
          .end method

          .method public static native setAimbotFOV(F)V
          .end method

          .method public static native setAimbotSmoothing(F)V
          .end method

          .method public static native setAimbotBone(I)V
          .end method

          .method public static native setAimbotSilent(Z)V
          .end method

          .method public static native setAimbotVisibleOnly(Z)V
          .end method

          .method public static native setESPBox(Z)V
          .end method

          .method public static native setESPSkeleton(Z)V
          .end method

          .method public static native setESPHealthBar(Z)V
          .end method

          .method public static native setESPName(Z)V
          .end method

          .method public static native setESPDistance(Z)V
          .end method

          .method public static native setESPLine(Z)V
          .end method

          .method public static native setESPMaxDistance(F)V
          .end method
          SMALI_EOF

          # Create Injector smali class (loads native library early)
          cat > smali/com/pubg/mod/Injector.smali << 'SMALI_EOF'
          .class public Lcom/pubg/mod/Injector;
          .super Ljava/lang/Object;

          .method public constructor <init>()V
              .locals 0
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method

          .method public static load()V
              .locals 1

              :try_start_0
              const-string v0, "pmod"
              invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V

              const-string v0, "PMod"
              const-string v1, "Native library loaded successfully"
              invoke-static {v0, v1}, Landroid/util/Log;->i(Ljava/lang/String;Ljava/lang/String;)I

              invoke-static {}, Lcom/pubg/mod/NativeBridge;->init()V
              :try_end_0
              .catch Ljava/lang/Throwable; {:try_start_0 .. :try_end_0} :catch_0

              return-void

              :catch_0
              move-exception v0
              const-string v0, "PMod"
              const-string v1, "Failed to load native library"
              invoke-static {v0, v1}, Landroid/util/Log;->e(Ljava/lang/String;Ljava/lang/String;)I

              return-void
          .end method
          SMALI_EOF

      - name: Patch Main Application Class
        run: |
          cd decompiled

          # Find main application class and inject library loading
          # This patches the entry point to load our library first
          python3 << 'PYTHON_EOF'
          import os
          import re

          # Find the main Application class
          main_class = None
          for root, dirs, files in os.walk("smali"):
              for f in files:
                  if f.endswith(".smali"):
                      path = os.path.join(root, f)
                      with open(path, 'r', errors='ignore') as fh:
                          content = fh.read()
                          # Look for Application class with attachBaseContext or onCreate
                          if ".super Landroid/app/Application;" in content:
                              main_class = path
                              break
              if main_class:
                  break

          # If no Application class found, look for main activity
          if not main_class:
              for root, dirs, files in os.walk("smali"):
                  for f in files:
                      if f.endswith(".smali"):
                          path = os.path.join(root, f)
                          with open(path, 'r', errors='ignore') as fh:
                              content = fh.read()
                              if "Lcom/tencent/ig/MainActivity;" in content or "MainActivity" in f:
                                  main_class = path
                                  break
                  if main_class:
                      break

          if main_class:
              print(f"[*] Found main class: {main_class}")
              with open(main_class, 'r', errors='ignore') as fh:
                  content = fh.read()

              # Inject load() call into attachBaseContext if exists, or onCreate
              injection = """
              invoke-static {}, Lcom/pubg/mod/Injector;->load()V
              """

              # Try to inject into attachBaseContext
              if "attachBaseContext" in content:
                  # Find the method and inject after super call
                  pattern = r'(attachBaseContext\(Landroid/content/Context;\)V.*?invoke-super \{p0, p1\}, Landroid/app/Application;->attachBaseContext\(Landroid/content/Context;\)V)'
                  match = re.search(pattern, content, re.DOTALL)
                  if match:
                      content = content.replace(
                          match.group(1),
                          match.group(1) + injection
                      )
                      print("[+] Injected into attachBaseContext")
                  else:
                      # Simpler approach: inject into onCreate
                      pattern = r'(onCreate\(\)V.*?invoke-super \{p0\}, Landroid/app/Application;->onCreate\(\)V)'
                      match = re.search(pattern, content, re.DOTALL)
                      if match:
                          content = content.replace(
                              match.group(1),
                              match.group(1) + injection
                          )
                          print("[+] Injected into onCreate")
              else:
                  # Try onCreate
                  pattern = r'(onCreate\(\)V.*?invoke-super \{p0\}, Landroid/app/Application;->onCreate\(\)V)'
                  match = re.search(pattern, content, re.DOTALL)
                  if match:
                      content = content.replace(
                          match.group(1),
                          match.group(1) + injection
                      )
                      print("[+] Injected into onCreate")

              with open(main_class, 'w') as fh:
                  fh.write(content)
              print(f"[+] Patched {main_class}")
          else:
              print("[-] Could not find main class, using fallback method")
              # Fallback: create a wrapper that gets loaded via class loader hook
              # This is more complex and may need manual intervention

              # For now, inject into the first found activity
              for root, dirs, files in os.walk("smali"):
                  for f in files:
                      if f.endswith("MainActivity.smali") or f.endswith("Activity.smali"):
                          path = os.path.join(root, f)
                          print(f"[*] Injecting into: {path}")
                          with open(path, 'r', errors='ignore') as fh:
                              content = fh.read()

                          # Inject into static constructor or onCreate
                          if "onCreate" in content:
                              injection = "invoke-static {}, Lcom/pubg/mod/Injector;->load()V\n"
                              # Find and inject
                              lines = content.split('\n')
                              for i, line in enumerate(lines):
                                  if '.method public onCreate(' in line or '.method protected onCreate(' in line:
                                      # Find invoke-super and inject after
                                      for j in range(i, min(i+20, len(lines))):
                                          if 'invoke-super' in lines[j]:
                                              lines.insert(j+1, injection)
                                              break
                                      break
                              content = '\n'.join(lines)
                              with open(path, 'w') as fh:
                                  fh.write(content)
                              print(f"[+] Injected into {path}")
                              break
                  break

          # Add AndroidManifest permission if needed
          manifest_path = "AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', errors='ignore') as fh:
                  manifest = fh.read()
              # Add any additional permissions if needed
              print("[*] Manifest checked")

          PYTHON_EOF

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled -o modded_unsigned.apk --use-aapt2
          ls -la modded_unsigned.apk

      - name: Generate Signing Keystore
        run: |
          if [ -z "${{ inputs.keystore_pass }}" ]; then
            export STORE_PASS="pmod123456"
          else
            export STORE_PASS="${{ inputs.keystore_pass }}"
          fi

          keytool -genkey -v \
            -keystore signing.keystore \
            -alias pmod \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass $STORE_PASS \
            -keypass $STORE_PASS \
            -dname "CN=PMod, OU=PMod, O=PMod, L=PMod, ST=PMod, C=US"

          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV

      - name: Sign APK
        run: |
          # Zipalign
          zipalign -v -p 4 modded_unsigned.apk modded_aligned.apk

          # Sign with v2 scheme (required for Android 11+)
          apksigner sign \
            --ks signing.keystore \
            --ks-key-alias pmod \
            --ks-pass pass:$STORE_PASS \
            --key-pass pass:$STORE_PASS \
            --out PUBG_Mobile_PMod_4.6.0_signed.apk \
            modded_aligned.apk

          # Verify
          apksigner verify --verbose PUBG_Mobile_PMod_4.6.0_signed.apk
          ls -la PUBG_Mobile_PMod_4.6.0_signed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-Mobile-PMod-signed
          path: PUBG_Mobile_PMod_4.6.0_signed.apk
          retention-days: 30

      - name: Upload to Release (optional)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: PUBG_Mobile_PMod_4.6.0_signed.apk
          tag_name: build-${{ github.run_number }}
          name: PUBG Mobile Mod Build ${{ github.run_number }}
          body: |
            ## PUBG Mobile Mod 4.6.0 (64-bit)

            **Features:**
            - ESP (Box, Skeleton, Health, Name, Distance)
            - Aimbot (Silent Aim, Smooth, FOV-based)
            - No Grass/Tree
            - 120 FPS Unlock
            - HDR Unlock
            - Reduced Recoil
            - Anti-cheat bypass (libanogs patches)

            **Install:**
            1. Uninstall original PUBG Mobile
            2. Install the signed APK
            3. Open and play

            **Note:** Only ESP and Aimbot are active.
          token: ${{ secrets.GITHUB_TOKEN }}
